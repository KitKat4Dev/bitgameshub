<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404</title>

  <!-- Google Font for a modern look -->
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet"
  />

  <style>
    /*************************************
     * RESET & BASE
     *************************************/
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: #000;
      color: #fff;
      text-align: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /*************************************
     * ANIMATED BACKGROUND
     *************************************/
    body::before {
      /* Animated neon gradient */
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background: linear-gradient(-45deg, #ff004f, #fcba03, #26f7fd, #ab42ff);
      background-size: 400% 400%;
      z-index: -3;
      animation: gradientMove 15s ease infinite;
    }
    @keyframes gradientMove {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /*************************************
     * CONTAINER & LAYOUT
     *************************************/
    .container {
      padding: 80px 20px;
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      z-index: 2; /* above the background */
    }

    /*************************************
     * GLITCH TEXT
     *************************************/
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.5rem;
      position: relative;
      color: #fff;
      margin-bottom: 25px;
      text-transform: uppercase;
      line-height: 1.2;
      /* We’ll apply a glitch effect using pseudo-elements */
    }
    h1::before,
    h1::after {
      content: attr(data-text); /* copy the text */
      position: absolute;
      left: 0;
      width: 100%;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    h1::before {
      top: -2px;
      text-shadow: -2px 0 #f0f;
      animation: glitchTop 2s infinite;
      color: #f0f;
    }
    h1::after {
      top: 2px;
      text-shadow: -2px 0 #0ff;
      animation: glitchBot 2s infinite;
      color: #0ff;
    }

    @keyframes glitchTop {
      0% {
        clip: rect(44px, 9999px, 12px, 0);
        transform: skew(0.3deg);
      }
      5% {
        clip: rect(12px, 9999px, 90px, 0);
        transform: skew(0.1deg);
      }
      10% {
        clip: rect(80px, 9999px, 16px, 0);
        transform: skew(0.3deg);
      }
      15% {
        clip: rect(12px, 9999px, 96px, 0);
        transform: skew(0.1deg);
      }
      20% {
        clip: rect(44px, 9999px, 12px, 0);
        transform: skew(0.3deg);
      }
      100% {
        clip: rect(44px, 9999px, 12px, 0);
        transform: skew(0.3deg);
      }
    }
    @keyframes glitchBot {
      0% {
        clip: rect(10px, 9999px, 130px, 0);
        transform: skew(0.3deg);
      }
      5% {
        clip: rect(80px, 9999px, 46px, 0);
        transform: skew(0.2deg);
      }
      10% {
        clip: rect(14px, 9999px, 90px, 0);
        transform: skew(0.3deg);
      }
      15% {
        clip: rect(80px, 9999px, 130px, 0);
        transform: skew(0.2deg);
      }
      20% {
        clip: rect(10px, 9999px, 90px, 0);
        transform: skew(0.3deg);
      }
      100% {
        clip: rect(10px, 9999px, 130px, 0);
        transform: skew(0.3deg);
      }
    }

    /*************************************
     * PARAGRAPH
     *************************************/
    p {
      font-size: 1.2rem;
      margin-bottom: 40px;
      line-height: 1.6;
      max-width: 600px;
      margin: 0 auto 40px;
    }

    /*************************************
     * BUTTONS
     *************************************/
    .button {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #fff;
      backdrop-filter: blur(2px);
      color: #fff;
      padding: 14px 28px;
      font-size: 1rem;
      margin: 10px;
      text-decoration: none;
      text-transform: uppercase;
      border-radius: 50px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
    }
    .button:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
    }

    /*************************************
     * INVISIBLE EASTER EGG BUTTON
     *************************************/
    #easterBtn {
      position: fixed;
      top: 0;
      right: 0;
      width: 50px;
      height: 50px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 1000;
    }

    /*************************************
     * FROG EMOJIS ANIMATION
     *************************************/
    .frog {
      position: absolute;
      font-size: 1.8rem;
      animation-name: fall;
      animation-timing-function: linear;
      pointer-events: none;
    }
    @keyframes fall {
      0% {
        transform: translateY(-60px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(120vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

    errorMessage.setAttribute('data-text', randomMsg);

    // Function to create and animate frog emojis (🐸)
    function rainFrogs() {
      const numFrogs = 50;
      for (let i = 0; i < numFrogs; i++) {
        const frog = document.createElement('span');
        frog.classList.add('frog');
        frog.innerText = "🐸";
        // Set a random horizontal start position
        frog.style.left = Math.random() * 100 + "vw";
        // Randomize animation duration (2-5 seconds)
        const duration = 2 + Math.random() * 3;
        frog.style.animationDuration = duration + "s";
        // Random delay before the frog starts falling
        frog.style.animationDelay = Math.random() * 1 + "s";
        document.body.appendChild(frog);
        // Remove the frog after the animation ends
        frog.addEventListener('animationend', () => frog.remove());
      }
    }

    document.getElementById("easterBtn").addEventListener('click', rainFrogs);
